<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Documentation - EAM MES Package</title>
    
    <!-- Google Fonts for Vietnamese Docs: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- Mermaid.js for vector ERD rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({
            startOnLoad: true,
            theme: 'base',
            fontFamily: 'Inter, sans-serif',
            themeVariables: {
                fontFamily: 'Inter, sans-serif',
                primaryColor: '#ffffff',
                primaryTextColor: '#18181b',
                primaryBorderColor: '#e2e8f0',
                lineColor: '#2563eb',
                secondaryColor: '#fafafa',
                tertiaryColor: '#ffffff'
            }
        });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
